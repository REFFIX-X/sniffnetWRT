name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.0"
  TARGET_SUBDIR: "mediatek/filogic"
  GCC: "14.3.0"
  SDK_URL: "https://downloads.openwrt.org/releases/25.12.0/targets/mediatek/filogic/openwrt-sdk-25.12.0-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: build aarch64 (Flint 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Check frontend JavaScript syntax
        run: node --check web/app.js

      - name: Check installer shell syntax
        run: |
          sh -n scripts/install.sh
          sh -n openwrt/cross-build.sh

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk python3 wget unzip file rsync \
                                  libncurses-dev zlib1g-dev libpcap-dev pkg-config zstd cmake ninja-build flex bison

      - name: Run Rust tests
        run: cargo test --manifest-path daemon/Cargo.toml

      - name: Download and extract the OpenWrt SDK
        run: |
          curl -fL "$SDK_URL" -o sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          echo "SDK extracted:"
          ls sdk

      - name: Cross-compile libpcap (manual)
        run: |
          STAGING_DIR="${{ github.workspace }}/sdk/staging_dir"
          TOOLCHAIN_DIR=$(ls -d "$STAGING_DIR"/toolchain-* | head -n1)
          TARGET_DIR=$(ls -d "$STAGING_DIR"/target-* | head -n1)
          CC="$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-gcc"
          echo "toolchain: $TOOLCHAIN_DIR"
          echo "target:    $TARGET_DIR"
          curl -fL https://www.tcpdump.org/release/libpcap-1.10.5.tar.xz -o libpcap.tar.xz
          tar -xf libpcap.tar.xz
          cd libpcap-1.10.5
          ./configure --host=aarch64-openwrt-linux-musl --with-pcap=linux --prefix=/usr CC="$CC"
          make -j"$(nproc)"
          make install DESTDIR="$TARGET_DIR"
          ls "$TARGET_DIR/usr/lib/pkgconfig" "$TARGET_DIR/usr/lib" 2>&1 | head -20

      - name: Cross-compile sniffnetwrt
        run: bash openwrt/cross-build.sh
        env:
          SDK_DIR: "${{ github.workspace }}/sdk"

      - name: Package the binary + web UI + init scripts
        run: |
          mkdir -p dist
          cp daemon/target/aarch64-unknown-linux-musl/release/sniffnetwrt dist/
          cp -r web dist/
          cp openwrt/sniffnetwrt.init dist/
          cp openwrt/sniffnetwrt.config dist/
          cp scripts/install.sh dist/
          tar -czf sniffnetwrt-aarch64.tar.gz -C dist sniffnetwrt web sniffnetwrt.init sniffnetwrt.config install.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniffnetwrt-aarch64
          path: sniffnetwrt-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release tarball
        uses: actions/download-artifact@v4
        with:
          name: sniffnetwrt-aarch64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: sniffnetWRT ${{ github.ref_name }}
          generate_release_notes: true
          files: sniffnetwrt-aarch64.tar.gz
